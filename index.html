<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard giocatori</title>
<style>
:root{--bg:#07131f;--panel:#10283d;--panel2:#0b1d2c;--ink:#f5f9fc;--muted:#a9bac9;--green:#38d39f;--line:#5f7689}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#15354e 0,var(--bg) 36%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.app{max-width:1500px;margin:auto;padding:28px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{color:var(--green);font-weight:800;letter-spacing:.16em;font-size:.72rem;text-transform:uppercase}.top h1{font-size:clamp(1.7rem,4vw,3rem);margin:.25rem 0 0;letter-spacing:-.04em}.top p{margin:.35rem 0 0;color:var(--muted)}
.tabs{display:flex;background:#06101a;border:1px solid #254158;border-radius:13px;padding:5px;gap:5px}.tab{border:0;background:transparent;color:var(--muted);padding:10px 17px;border-radius:9px;font-weight:750;cursor:pointer}.tab.active{background:var(--green);color:#062018}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}.controls,.content{background:linear-gradient(145deg,rgba(16,40,61,.97),rgba(8,24,37,.97));border:1px solid #244158;border-radius:20px;box-shadow:0 20px 50px #0005}.controls{padding:20px;height:max-content;position:sticky;top:16px}.content{padding:22px;min-height:720px}
label,.label{display:block;color:#c8d6e2;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}.control{margin-bottom:19px}select,input[type=search]{width:100%;background:#f7fbff;color:#10202d;border:0;border-radius:10px;padding:12px;font:inherit;outline:none}select[multiple]{min-height:230px}.hint{color:var(--muted);font-size:.78rem;line-height:1.45;margin-top:7px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#07131f;padding:4px;border-radius:10px}.seg button{border:0;border-radius:7px;padding:9px 3px;color:var(--muted);background:transparent;font-weight:750;cursor:pointer}.seg button.active{color:#07131f;background:#e5f2eb}.toggle{display:flex;align-items:center;gap:9px;color:#dbe6ef;font-size:.9rem}.toggle input{accent-color:var(--green);width:17px;height:17px}.actions{display:grid;gap:8px}.action{border:1px solid #3d6078;background:#14334b;color:white;border-radius:10px;padding:11px;font-weight:750;cursor:pointer}.action.primary{background:var(--green);border-color:var(--green);color:#052018}
.summary{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.chip{background:#071723;border:1px solid #29475d;border-radius:12px;padding:10px 13px}.chip b{display:block;font-size:1.05rem}.chip span{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}.charts{display:grid;grid-template-columns:1fr;gap:18px}.charts.two{grid-template-columns:repeat(2,minmax(0,1fr))}.chart-card{background:#071723;border:1px solid #29475d;border-radius:17px;padding:14px;min-width:0}.chart-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 4px}.chart-title h2{font-size:1rem;margin:0}.chart-title span{color:var(--muted);font-size:.78rem}.canvas-wrap{position:relative;width:100%;aspect-ratio:1.12/1;min-height:520px}.canvas-wrap canvas{position:absolute;width:100%;height:100%;inset:0}.notice{background:#392b12;color:#f6d991;border:1px solid #715520;border-radius:10px;padding:10px 12px;font-size:.85rem;margin-bottom:14px;display:none}.empty{display:grid;place-items:center;min-height:560px;color:var(--muted);text-align:center}.footer{color:#718696;font-size:.75rem;margin-top:16px;text-align:right}
@media(max-width:950px){.layout{grid-template-columns:1fr}.controls{position:static}.charts.two{grid-template-columns:1fr}.canvas-wrap{min-height:480px}.top{align-items:flex-start;flex-direction:column}.tabs{width:100%}.tab{flex:1}}
@media(max-width:560px){.app{padding:14px}.content,.controls{padding:14px;border-radius:15px}.canvas-wrap{min-height:430px;aspect-ratio:.85/1}.chart-card{padding:7px}.summary{gap:6px}.chip{padding:8px 10px}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div><div class="eyebrow">Player analytics</div><h1>Giocatori di movimento</h1><p>Profilo tecnico e confronto interattivo · valori su scala 1–10</p></div><div class="tabs"><button class="tab active" data-mode="single">Scheda</button><button class="tab" data-mode="compare">Confronto</button></div></header>
  <section class="layout">
    <aside class="controls">
      <div class="control"><div class="label">Area</div><div class="seg" id="area"><button data-area="ATTACCO" class="active">Attacco</button><button data-area="DIFESA">Difesa</button><button data-area="ENTRAMBI">Entrambi</button></div></div>
      <div class="control" id="singleControl"><label for="single">Giocatore</label><input type="search" id="searchSingle" placeholder="Cerca giocatore…"><select id="single" size="8"></select></div>
      <div class="control" id="compareControl" hidden><label for="compare">Confronta 2–4 giocatori</label><input type="search" id="searchCompare" placeholder="Filtra elenco…"><select id="compare" multiple></select><div class="hint">Tieni premuto Ctrl per selezioni separate. Su telefono basta toccare i nomi.</div></div>
      <div class="control"><label class="toggle"><input type="checkbox" id="values" checked> Mostra valori sugli assi</label></div>
      <div class="actions"><button class="action primary" id="download">Scarica grafico PNG</button><button class="action" id="reset">Reimposta selezione</button></div>
    </aside>
    <section class="content"><div id="notice" class="notice"></div><div id="summary" class="summary"></div><div id="charts" class="charts"></div><div class="footer">Dati incorporati da “GIOCATORI DI MOVIMENTO.xlsx”</div></section>
  </section>
</main>

function drawRadar(canvas,area,selected){
 const dpr=Math.min(devicePixelRatio||1,2),rect=canvas.getBoundingClientRect();canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);const W=rect.width,H=rect.height;
 ctx.clearRect(0,0,W,H);const cx=W/2,cy=H/2+8,R=Math.min(W*.33,H*.34),labels=skills(area);const n=labels.length,angle=i=>-Math.PI/2+i*2*Math.PI/n,pt=(r,i)=>[cx+Math.cos(angle(i))*r,cy+Math.sin(angle(i))*r];
 ctx.lineJoin='round';ctx.lineCap='round';
 for(let ring=2;ring<=10;ring+=2){ctx.beginPath();for(let i=0;i<n;i++){const [x,y]=pt(R*ring/10,i);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.strokeStyle=ring===10?'#71879a':'#304a5e';ctx.lineWidth=ring===10?1.3:.7;ctx.stroke();ctx.fillStyle='#8295a4';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText(ring,cx+4,cy-R*ring/10+11)}
 for(let i=0;i<n;i++){const [x,y]=pt(R,i);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.strokeStyle='#304a5e';ctx.lineWidth=.7;ctx.stroke()}
 selected.forEach((name,idx)=>{const row=find(area,name);if(!row)return;const vals=labels.map(k=>Number.isFinite(row[k])?row[k]:null);if(vals.filter(Number.isFinite).length<3)return;ctx.beginPath();vals.forEach((v,i)=>{const [x,y]=pt(R*(v??0)/10,i);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle=COLORS[idx]+'35';ctx.strokeStyle=COLORS[idx];ctx.lineWidth=2.5;ctx.fill();ctx.stroke();vals.forEach((v,i)=>{if(v==null)return;const [x,y]=pt(R*v/10,i);ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle=COLORS[idx];ctx.fill();ctx.strokeStyle='#07131f';ctx.lineWidth=1.5;ctx.stroke();if(state.values){const [tx,ty]=pt(R*v/10+13,i);ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(v,tx,ty)}})});
 ctx.fillStyle='#eaf2f8';ctx.font=`700 ${W<520?10:11}px system-ui`;ctx.textBaseline='middle';for(let i=0;i<n;i++){const [x,y]=pt(R+Math.min(64,W*.13),i);ctx.textAlign=Math.cos(angle(i))>.25?'left':Math.cos(angle(i))<-.25?'right':'center';wrap(ctx,labels[i],x,y,Math.min(105,W*.21),12)}
}

function render(){
 const selected=state.mode==='single'?[state.single]:state.compare;const areas=state.area==='ENTRAMBI'?['ATTACCO','DIFESA']:[state.area];const charts=$('#charts'),notice=$('#notice'),summary=$('#summary');charts.innerHTML='';summary.innerHTML='';notice.style.display='none';
 if(state.mode==='compare'&&(selected.length<2||selected.length>4)){charts.innerHTML='<div class="empty">Seleziona da 2 a 4 giocatori per iniziare il confronto.</div>';return}
 let missing=[];selected.forEach((name,idx)=>{let all=[];areas.forEach(a=>{const row=find(a,name);if(row)all.push(...skills(a).map(k=>row[k]).filter(Number.isFinite))});const avg=mean(all);summary.insertAdjacentHTML('beforeend',`<div class="chip" style="border-color:${COLORS[idx]}"><b style="color:${COLORS[idx]}">${esc(name)}</b><span>Ruolo ${find('ATTACCO',name)?.RUOLO??'–'} · Media ${avg?.toFixed(2)??'N/D'}</span></div>`)});
 areas.forEach(area=>{selected.forEach(name=>{const row=find(area,name);if(row){const m=skills(area).filter(k=>!Number.isFinite(row[k]));if(m.length)missing.push(`${name}: ${m.length} valori ${area.toLowerCase()} mancanti`)}});const card=document.createElement('div');card.className='chart-card';card.innerHTML=`<div class="chart-title"><h2>${area[0]+area.slice(1).toLowerCase()}</h2><span>${skills(area).length} competenze</span></div><div class="canvas-wrap"><canvas></canvas></div>`;charts.append(card);requestAnimationFrame(()=>drawRadar(card.querySelector('canvas'),area,selected))});
 charts.classList.toggle('two',areas.length===2);if(missing.length){notice.textContent='Dati incompleti — '+missing.join(' · ')+'. I punti mancanti non contribuiscono alla media.';notice.style.display='block'}
}

$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.mode=b.dataset.mode;$('#singleControl').hidden=state.mode!=='single';$('#compareControl').hidden=state.mode!=='compare';render()});
$$('#area button').forEach(b=>b.onclick=()=>{$$('#area button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.area=b.dataset.area;render()});
$('#single').onchange=e=>{state.single=e.target.value;render()};$('#compare').onchange=e=>{state.compare=[...e.target.selectedOptions].map(o=>o.value);if(state.compare.length>4){e.target.options[e.target.selectedIndex].selected=false;state.compare=[...e.target.selectedOptions].map(o=>o.value)}render()};
$('#searchSingle').oninput=e=>fillSelect($('#single'),e.target.value);$('#searchCompare').oninput=e=>fillSelect($('#compare'),e.target.value);
$('#values').onchange=e=>{state.values=e.target.checked;render()};window.onresize=()=>{clearTimeout(window._rr);window._rr=setTimeout(render,120)};
$('#reset').onclick=()=>{state.single=names[0];state.compare=names.slice(0,2);$('#single').value=state.single;[...$('#compare').options].forEach(o=>o.selected=state.compare.includes(o.value));render()};
$('#download').onclick=()=>{const canvases=$$('#charts canvas');if(!canvases.length)return;const gap=24,w=Math.max(...canvases.map(c=>c.width)),h=canvases.reduce((a,c)=>a+c.height,0)+gap*(canvases.length-1),out=document.createElement('canvas');out.width=w;out.height=h;const c=out.getContext('2d');c.fillStyle='#07131f';c.fillRect(0,0,w,h);let y=0;canvases.forEach(x=>{c.drawImage(x,0,y);y+=x.height+gap});const a=document.createElement('a');a.download=`radar_${state.mode}_${state.area.toLowerCase()}.png`;a.href=out.toDataURL('image/png');a.click()};
render();
</script>
</body>
</html>
